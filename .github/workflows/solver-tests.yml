name: Poker solver tests

on:
  push:
    paths:
      - "poker_heck/solver/**"
      - ".github/workflows/solver-tests.yml"
  pull_request:
    paths:
      - "poker_heck/solver/**"
      - ".github/workflows/solver-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poker_heck/solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov=engine --cov=solver_core --cov=api --cov-branch -q
      - run: >-
          python train_multiway_postflop.py examples/multiway_postflop_demo.json
          --iterations 1 --checkpoint /tmp/multiway.pkl --export /tmp/multiway.csv
